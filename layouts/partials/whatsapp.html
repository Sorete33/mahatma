<!-- Componente del Botón Flotante Fijo de WhatsApp (Inyectado al final) -->
<div id="wpp-floating-container" style="position: fixed !important; bottom: 30px !important; right: 30px !important; z-index: 99999 !important; display: block !important;">
  <button onclick="toggleWppFloatMenu(event)" aria-label="Contacto por WhatsApp" 
          style="width: 60px !important; height: 60px !important; background-color: #25d366 !important; border: none !important; border-radius: 50% !important; display: flex !important; justify-content: center !important; align-items: center !important; cursor: pointer !important; box-shadow: 0 8px 24px rgba(0,0,0,0.2) !important; padding: 0 !important; margin: 0 !important;">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" style="width: 32px !important; height: 32px !important; display: block !important;">
  </button>
  
  <div id="wpp-float-options" 
       style="display: none; position: absolute !important; bottom: 75px !important; right: 0 !important; background: #ffffff !important; padding: 8px !important; border-radius: 8px !important; box-shadow: 0 4px 15px rgba(0,0,0,0.15) !important; flex-direction: column !important; gap: 6px !important; min-width: 140px !important; border: 1px solid #e4e7e4 !important; z-index: 99999 !important;">
    <a href="https://wa.me/542346331020?text=Hola!%20Quiero%20hacer%20una%20consulta" target="_blank" rel="noopener" style="text-decoration: none !important; color: #333333 !important; font-weight: 600 !important; font-family: 'Montserrat', sans-serif !important; font-size: 13px !important; padding: 6px 10px !important; display: block !important; text-align: left !important;">Mahatma 1</a>
    <a href="https://wa.me/542346688161?text=Hola!%20Quiero%20hacer%20una%20consulta" target="_blank" rel="noopener" style="text-decoration: none !important; color: #333333 !important; font-weight: 600 !important; font-family: 'Montserrat', sans-serif !important; font-size: 13px !important; padding: 6px 10px !important; display: block !important; text-align: left !important;">Mahatma 2</a>
    <a href="https://wa.me/542346503834?text=Hola!%20Quiero%20hacer%20una%20consulta" target="_blank" rel="noopener" style="text-decoration: none !important; color: #333333 !important; font-weight: 600 !important; font-family: 'Montserrat', sans-serif !important; font-size: 13px !important; padding: 6px 10px !important; display: block !important; text-align: left !important;">Mahatma 3</a>
  </div>
</div>

<script>
  function toggleWppFloatMenu(event) {
    if (event) { event.stopPropagation(); }
    var x = document.getElementById("wpp-float-options");
    if (x) {
      x.style.display = (x.style.display === "none" || x.style.display === "") ? "flex" : "none";
    }
  }

  document.addEventListener("click", function(event) {
    var dropdown = document.getElementById("wpp-float-options");
    if (dropdown) { dropdown.style.display = "none"; }
  });

  // Vinculación interactiva entre el botón Escribinos y el contenedor flotante
  document.addEventListener("DOMContentLoaded", function() {
    var btnEscribinos = document.getElementById("btn-escribinos");
    if (btnEscribinos) {
      btnEscribinos.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopPropagation();
        
        var dropdown = document.getElementById("wpp-float-options");
        if (dropdown) {
          dropdown.style.display = "flex";
          var container = document.getElementById("wpp-floating-container");
          if (container) {
            container.scrollIntoView({ behavior: 'smooth', block: 'end' });
          }
        }
      });
    }
  });
</script>
