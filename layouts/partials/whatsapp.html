<!-- Componente del Botón Flotante Fijo de WhatsApp (Inyectado al final) -->
<div id="wpp-floating-container" class="wpp-floating-container">
  <button onclick="toggleWppFloatMenu(event)" aria-label="Contacto por WhatsApp" class="wpp-float-btn">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" class="wpp-float-icon">
  </button>
  
  <div id="wpp-float-options" class="wpp-float-options" style="display: none;">
    <a href="https://wa.me/542346331020?text=Hola!%20Quiero%20hacer%20una%20consulta" target="_blank" rel="noopener" class="wpp-float-link">Mahatma 1</a>
    <a href="https://wa.me/542346688161?text=Hola!%20Quiero%20hacer%20una%20consulta" target="_blank" rel="noopener" class="wpp-float-link">Mahatma 2</a>
    <a href="https://wa.me/542346503834?text=Hola!%20Quiero%20hacer%20una%20consulta" target="_blank" rel="noopener" class="wpp-float-link">Mahatma 3</a>
  </div>
</div>

<script>
  function toggleWppFloatMenu(event) {
    if (event) { event.stopPropagation(); }
    var x = document.getElementById("wpp-float-options");
    if (x) {
      x.style.display = (x.style.display === "none" || x.style.display === "") ? "flex" : "none";
    }
  }

  document.addEventListener("click", function(event) {
    var dropdown = document.getElementById("wpp-float-options");
    if (dropdown) { dropdown.style.display = "none"; }
  });

  // Lógica de vinculación interactiva para el botón "Escribinos" del Banner
  document.addEventListener("DOMContentLoaded", function() {
    var btnEscribinos = document.getElementById("btn-escribinos");
    if (btnEscribinos) {
      btnEscribinos.addEventListener("click", function(e) {
        e.preventDefault(); 
        e.stopPropagation();  
        
        var dropdown = document.getElementById("wpp-float-options");
        if (dropdown) {
          dropdown.style.display = "flex"; 
        }
      });
    }
  });
</script>
