<h1>{{ site.Title }}</h1>

<nav class="nav-links">
  <ul style="display: flex !important; align-items: center !important;">
    {{ range site.Menus.main }}
      <li><a href="{{ .URL | relURL }}">{{ .Name }}</a></li>
    {{ end }}
    
    <li style="position: relative !important; display: inline-flex !important; align-items: center !important; list-style: none !important; margin-left: 15px !important; z-index: 99999 !important;">
      <button onclick="toggleSoloHeaderWpp(event)" aria-label="Contacto WhatsApp" 
              style="width: 32px !important; height: 32px !important; background-color: #25d366 !important; border: none !important; border-radius: 50% !important; display: flex !important; justify-content: center !important; align-items: center !important; cursor: pointer !important; padding: 0 !important; box-shadow: 0 2px 5px rgba(0,0,0,0.1) !important;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" style="width: 18px !important; height: 18px !important; display: block !important;">
      </button>
      
      <div id="dropdown-wpp-exclusivo-header" 
           style="display: none; position: absolute !important; top: 40px !important; right: 0 !important; background: #ffffff !important; padding: 8px !important; border-radius: 8px !important; box-shadow: 0 4px 15px rgba(0,0,0,0.15) !important; flex-direction: column !important; gap: 6px !important; min-width: 150px !important; border: 1px solid #e4e7e4 !important; z-index: 99999 !important;">
        <a href="https://wa.me/542346331020?text=Hola!%20Quiero%20hacer%20una%20consulta" target="_blank" rel="noopener" style="text-decoration: none !important; color: #333333 !important; font-weight: 600 !important; font-family: 'Montserrat', sans-serif !important; font-size: 13px !important; padding: 6px 12px !important; display: block !important; text-align: left !important;">Sede Laborde</a>
        <a href="https://wa.me/542346688161?text=Hola!%20Quiero%20hacer%20una%20consulta" target="_blank" rel="noopener" style="text-decoration: none !important; color: #333333 !important; font-weight: 600 !important; font-family: 'Montserrat', sans-serif !important; font-size: 13px !important; padding: 6px 12px !important; display: block !important; text-align: left !important;">Sede Pintos</a>
        <a href="https://wa.me/542346503834?text=Hola!%20Quiero%20hacer%20una%20consulta" target="_blank" rel="noopener" style="text-decoration: none !important; color: #333333 !important; font-weight: 600 !important; font-family: 'Montserrat', sans-serif !important; font-size: 13px !important; padding: 6px 12px !important; display: block !important; text-align: left !important;">Sede Alvear</a>
      </div>
    </li>
  </ul>
</nav>

<script>
  function toggleSoloHeaderWpp(event) {
    event.preventDefault();
    event.stopPropagation();
    var box = document.getElementById("dropdown-wpp-exclusivo-header");
    if (box) {
      box.style.display = (box.style.display === "none" || box.style.display === "") ? "flex" : "none";
    }
  }

  document.addEventListener("click", function(event) {
    var box = document.getElementById("dropdown-wpp-exclusivo-header");
    if (box) { box.style.display = "none"; }
  });
</script>

<style>
@media (max-width: 768px) {
  .page-shell, .morandi-nav, .main-container { padding-left: 20px !important; padding-right: 20px !important; }
  .morandi-nav { align-items: flex-start !important; justify-content: flex-start !important; }
  .brand { margin-left: 0 !important; padding-left: 0 !important; }
  .section-heading { display: flex !important; flex-direction: row !important; align-items: center !important; justify-content: flex-start !important; margin-left: 0 !important; padding-left: 0 !important; gap: 10px !important; }
  h2, .section-title { margin: 0 !important; padding: 0 !important; }
}
</style>
