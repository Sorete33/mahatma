<h1>{{ site.Title }}</h1>

<nav class="nav-links">
  <ul class="wpp-nav-list">
    {{ range site.Menus.main }}
      <li><a href="{{ .URL | relURL }}">{{ .Name }}</a></li>
    {{ end }}
    
    <li class="wpp-header-nav-item">
      <button onclick="toggleSoloHeaderWpp(event)" aria-label="Contacto WhatsApp" class="wpp-header-btn">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" class="wpp-header-icon">
      </button>
      
      <div id="dropdown-wpp-exclusivo-header" class="wpp-header-dropdown" style="display: none;">
        <a href="https://wa.me/542346331020?text=Hola!%20Quiero%20hacer%20una%20consulta" target="_blank" rel="noopener" class="wpp-dropdown-link">Sede Laborde</a>
        <a href="https://wa.me/542346688161?text=Hola!%20Quiero%20hacer%20una%20consulta" target="_blank" rel="noopener" class="wpp-dropdown-link">Sede Pintos</a>
        <a href="https://wa.me/542346503834?text=Hola!%20Quiero%20hacer%20una%20consulta" target="_blank" rel="noopener" class="wpp-dropdown-link">Sede Alvear</a>
      </div>
    </li>
  </ul>
</nav>

<script>
  function toggleSoloHeaderWpp(event) {
    event.preventDefault();
    event.stopPropagation();
    var box = document.getElementById("dropdown-wpp-exclusivo-header");
    if (box) {
      box.style.display = (box.style.display === "none" || box.style.display === "") ? "flex" : "none";
    }
  }

  document.addEventListener("click", function(event) {
    var box = document.getElementById("dropdown-wpp-exclusivo-header");
    if (box) { box.style.display = "none"; }
  });
</script>
