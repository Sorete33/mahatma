<section class="section-container">

  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 20px;">
    {{/* Aquí cambiamos .Data.director por .Data (o simplemente recorremos el rango) */}}
    {{ range .Data }}
      <div class="staff-card" style="text-align: center; padding: 15px; border: 1px solid #eee; border-radius: 8px;">
        {{ if .profile_image }}
          <img src="{{ .profile_image | relURL }}" alt="{{ .detail }}" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 10px;">
        {{ else }}
          <div style="width: 120px; height: 120px; border-radius: 50%; background: #ddd; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center;">Sin foto</div>
        {{ end }}
        
        <h4 style="margin: 5px 0;">{{ .detail }}</h4>
        
        <div class="badges">
  {{ range .badges }}
    <span class="staff-badge">{{ . }}</span>
  {{ end }}
</div>
      </div>
    {{ end }}
  </div>
</section>
