<section class="hero-container-wrapper" style="padding-top: 0;">
  {{ with .Data }}
  <div id="director" class="section-heading" style="margin-top: 3rem; margin-bottom: 1.5rem;">
    <span class="section-heading bar"></span>
    <h2>Staff</h2>
  </div>

  <div class="hero">
    <div class="hero-media">
      {{ if .profile_image }}
        <img src="{{ .profile_image | relURL }}" alt="{{ .name }}" class="hero-media-img" loading="lazy">
      {{ end }}
    </div>
    <div class="hero-copy">
      {{ with .title }}<span class="hero-copy eyebrow">{{ . }}</span>{{ end }}
      {{ with .name }}<h1>{{ . }}</h1>{{ end }}

      {{ if .highlights }}
        <p class="highlights-title">Destacados</p>
        <ul class="highlight-list">
          {{ range .highlights }}
            <li>{{ . }}</li>
          {{ end }}
        </ul>
      {{ end }}
    </div>
  </div>
  {{ end }}
</section>

<style>
  .hero-container-wrapper {
    padding-top: 0 !important;
    margin-top: 0 !important;
  }
  .section-heading {
    margin-top: 3rem !important; /* Fuerza el mismo margen para todos */
  }
</style>
