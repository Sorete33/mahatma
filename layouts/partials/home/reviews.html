<section id="reviews-section" style="padding: 3rem 1rem; text-align: center;">
  <h2>Lo que dicen de nosotros</h2>
  <div id="reviews-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1000px; margin: 2rem auto;">
    <p class="loading-text">Cargando reseñas de Google...</p>
  </div>
</section>

<script>
  async function loadReviews() {
    const container = document.getElementById('reviews-container');
    const placeIds = [
      "{{ site.Params.google_place_id_1 }}",
      "{{ site.Params.google_place_id_2 }}",
      "{{ site.Params.google_place_id_3 }}"
    ].filter(id => id && id !== ""); // Filter out empty strings

    try {
      const responses = await Promise.all(
        placeIds.map(id => fetch(`/api/reviews?placeId=${id}`).then(res => res.json()))
      );
      
      const allReviews = responses.flat().sort((a, b) => b.rating - a.rating);

      if (allReviews.length > 0) {
        // Inside your loadReviews function's .map() call:
container.innerHTML = allReviews.slice(0, 6).map(r => {
  // Si la reseña no tiene texto, ponemos un mensaje genérico o un texto vacío
  const textoReseña = r.text ? r.text : "Calificó con 5 estrellas sin dejar comentarios.";
  
  return `
    <div class="review-card" style="border: 1px solid #ddd; padding: 20px; border-radius: 12px; text-align: left; background: #fff;">
      <div style="color: #f39c12; margin-bottom: 10px;">
        ${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}
      </div>
      <p style="font-size: 0.95rem; color: #333; margin-bottom: 15px;">
        "${textoReseña.substring(0, 150)}${textoReseña.length > 150 ? '...' : ''}"
      </p>
      <p style="font-size: 0.85rem; font-weight: bold;">— ${r.author_name}</p>
    </div>
  `;
}).join('');
      } else {
        container.innerHTML = "<p>Por el momento no tenemos reseñas cargadas.</p>";
      }
    } catch (err) {
      console.error("Error loading reviews:", err);
      container.innerHTML = "<p>No pudimos cargar las reseñas. Intenta más tarde.</p>";
    }
  }
  
  // Initialize
  document.addEventListener('DOMContentLoaded', loadReviews);
</script>
