<div class="reviews-section">
  <h2>Lo que dicen de nuestros hogares</h2>
  <div id="reviews-container"></div>
</div>

<script>
  async function loadReviews() {
    const container = document.getElementById('reviews-container');
    // Accedemos a los valores definidos en hugo.toml
    const placeIds = [
      "{{ site.Params.google_place_id_1 }}",
      "{{ site.Params.google_place_id_2 }}",
      "{{ site.Params.google_place_id_3 }}"
    ];

    for (const id of placeIds) {
      if (!id || id === "") continue; 
      
      try {
        const res = await fetch(`/.netlify/functions/get-reviews?placeId=${id}`);
        const reviews = await res.json();
        
        if (reviews && reviews.length > 0) {
          reviews.slice(0, 2).forEach(r => {
            container.innerHTML += `
              <div class="review-card">
                <p><strong>${r.authorAttribution.displayName}</strong></p>
                <p>${r.text.text}</p>
              </div>
            `;
          });
        }
      } catch (err) {
        console.error("Error cargando reviews:", err);
      }
    }
  }
  loadReviews();
</script>
