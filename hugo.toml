themesDir = "themes"
baseURL = 'https://github.com/Sorete33/mahatma'
languageCode = 'es-AR'
title = 'Geriátricos Mahatma'
theme = 'hugo-celadon'
enableRobotsTXT = true

[params]
  description = 'Centros geriátricos mahatma.'
  email = 'geriatricosmahatma@gmail.com'
  location = 'Chivilcoy, Buenos Aires, Argentina'
  avatar = "static/portrait.png"

[params.homepage]
  sections = ["hero", "news", "research"]

  [params.homepage.hero]
    enable = true
    layout = "hero"
    title = "Nosotros"

  [params.homepage.news]
    enable = true
    layout = "news"
    title = "Staff"

  [params.homepage.research]
    enable = true
    layout = "cards"
    title = "Nuestros Hogares"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        enableInShortcodes = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [
            ["\\[", "\\]"],
            ["$$", "$$"]
          ]
          inline = [
            ["\\(", "\\)"],
            ["$", "$"]
          ]
  [markup.highlight]
    style = "friendly"
    noClasses = false
    lineNos = true
    guessSyntax = true

# ---------------------------------------------------------
# CASCADING DEFAULTS
# This applies settings to ALL files in the 'content' folder
# ---------------------------------------------------------

[[cascade]]
  layout = "single"      # 1. The Rule: Use single.html
  [cascade._target]
    path = "/**"         # 2. The Scope: Inside any folder (** = "Recursive")
    kind = "page"        # 3. The Filter: But ONLY for regular text files

# ---------------------------------------------------------
# CONFIGURACIÓN DEL MENÚ DE NAVEGACIÓN (HEADER)
# Mantiene tus secciones intactas pero te da los links correctos
# ---------------------------------------------------------

[[menus.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menus.main]]
  name = "Nosotros"
  url = "/#hero"         # Apunta al ID automático de la sección [params.homepage.hero]
  weight = 2

[[menus.main]]
  name = "Staff"
  url = "/#news"         # Apunta al ID automático de la sección [params.homepage.news]
  weight = 3

[[menus.main]]
  name = "Nuestros Hogares"
  url = "/#research"     # Apunta al ID automático de la sección [params.homepage.research]
  weight = 4