    <script>
(function () {
  const storageKey = "morandi-theme";
  const body = document.body;
  const toggleButtons = () =>
    document.querySelectorAll("[data-theme-toggle]");

  const applyTheme = (theme) => {
    const nextTheme = theme === "dark" ? "dark" : "light";
    body.setAttribute("data-theme", nextTheme);
    toggleButtons().forEach((btn) => {
      const sun = btn.querySelector("[data-icon-sun]");
      const moon = btn.querySelector("[data-icon-moon]");
      btn.setAttribute("aria-pressed", nextTheme === "dark");
      if (sun) sun.style.opacity = nextTheme === "dark" ? "0" : "1";
      if (moon) moon.style.opacity = nextTheme === "dark" ? "1" : "0";
    });
  };

  const stored = localStorage.getItem(storageKey);
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(stored || (prefersDark ? "dark" : "light"));

  toggleButtons().forEach((btn) => {
    btn.addEventListener("click", () => {
      const next =
        body.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(next);
      localStorage.setItem(storageKey, next);
    });
  });
})();

(function () {
  const wrappers = Array.from(document.querySelectorAll("[data-expandable]"));
  if (!wrappers.length) return;

  wrappers.forEach((wrapper) => {
    const limit = parseInt(wrapper.dataset.limit, 10);
    const content = wrapper.querySelector("[data-expandable-content]");
    const toggle = wrapper.querySelector("[data-expand-toggle]");
    if (!content || !Number.isFinite(limit)) return;
    const items = Array.from(content.children);
    if (items.length <= limit) {
      if (toggle) toggle.remove();
      return;
    }

    if (!toggle) return;

    wrapper.dataset.state = "collapsed";
    toggle.setAttribute("aria-expanded", "false");

    const applyState = () => {
      const expanded = wrapper.dataset.state === "expanded";
      items.forEach((item, index) => {
        const shouldHide = !expanded && index >= limit;
        item.classList.toggle("hidden", shouldHide);
      });
      toggle.textContent = expanded ? "Show Less ↑" : "Show More ↓";
      toggle.setAttribute("aria-expanded", expanded.toString());
    };

    toggle.addEventListener("click", () => {
      wrapper.dataset.state =
        wrapper.dataset.state === "expanded" ? "collapsed" : "expanded";
      applyState();
    });

    applyState();
  });
})();
</script>


    <button id="scroll-top" aria-label="Go to Top">↑</button>
    
    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/glightbox.min.js"></script>

    <script>
      (function () {
        
        if (typeof GLightbox === 'function') {
          GLightbox({
            selector: '.glightbox',
            loop: true
          });
        }

        
        const renderQueuedMath = () => {
          const attempt = () => {
            if (
              typeof window !== "undefined" &&
              typeof window.renderMathInElement === "function" &&
              typeof window.katex !== "undefined"
            ) {
              window.renderMathInElement(document.body, {
                delimiters: [
                  { left: "$$", right: "$$", display: true },
                  { left: "$", right: "$", display: false },
                  { left: "\\(", right: "\\)", display: false },
                  { left: "\\[", right: "\\]", display: true },
                ],
                throwOnError: false,
              });
              return true;
            }
            return false;
          };
          const tick = () => {
            if (!attempt()) {
              window.requestAnimationFrame(tick);
            }
          };
          tick();
        };

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", renderQueuedMath);
        } else {
          renderQueuedMath();
        }

        
        document.querySelectorAll(".highlight").forEach(function (highlight) {
          const codeBlock = highlight.querySelector("td.lntd:last-child pre code");
          if (!codeBlock) return;

          const langClass = Array.from(codeBlock.classList).find((cls) =>
            cls.startsWith("language-")
          );
          const label = langClass ? langClass.replace("language-", "").toUpperCase() : "CODE";

          const frame = document.createElement("div");
          frame.className = "code-frame";

          const header = document.createElement("div");
          header.className = "code-frame__header";
          const langTag = document.createElement("span");
          langTag.className = "code-frame__lang";
          langTag.textContent = label;
          header.appendChild(langTag);

          const button = document.createElement("button");
          button.className = "copy-btn";
          button.ariaLabel = "Copy code";
          const iconClipboard = `
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          `;
          const iconCheck = `
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          `;
          button.innerHTML = iconClipboard;
          header.appendChild(button);

          const body = document.createElement("div");
          body.className = "code-frame__body";
          frame.appendChild(header);
          frame.appendChild(body);

          const parent = highlight.parentNode;
          highlight.classList.add("code-frame__table");
          parent.replaceChild(frame, highlight);
          body.appendChild(highlight);

          button.addEventListener("click", function () {
            navigator.clipboard.writeText(codeBlock.innerText).then(function () {
              button.classList.add("copied");
              button.innerHTML = iconCheck;
              setTimeout(function () {
                button.classList.remove("copied");
                button.innerHTML = iconClipboard;
              }, 2000);
            });
          });
        });
      })();

      
      (function () {
        const btn = document.getElementById("scroll-top");
        if (!btn) return;
        window.addEventListener("scroll", () => {
          if (window.scrollY > 300) {
            btn.classList.add("show-scroll");
          } else {
            btn.classList.remove("show-scroll");
          }
        });
        btn.addEventListener("click", () => {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      })();
    </script>
