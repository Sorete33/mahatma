<h1>{{ site.Title }}</h1>

<nav class="nav-links">
  <ul>
    {{ range site.Menus.main }}
      <li><a href="{{ .URL | relURL }}">{{ .Name }}</a></li>
    {{ end }}
    
    <li class="nav-whatsapp-item">
      <button class="nav-whatsapp-btn" onclick="toggleNavWpp(event)" aria-label="Contacto WhatsApp">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
      </button>
      <div id="nav-wpp-dropdown" class="nav-wpp-dropdown" style="display: none;">
        <a href="https://wa.me/542346331020?text=Hola!%20Quiero%20hacer%20una%20consulta" target="_blank" rel="noopener">Sede Laborde</a>
        <a href="https://wa.me/542346688161?text=Hola!%20Quiero%20hacer%20una%20consulta" target="_blank" rel="noopener">Sede Pintos</a>
        <a href="https://wa.me/542346503834?text=Hola!%20Quiero%20hacer%20una%20consulta" target="_blank" rel="noopener">Sede Alvear</a>
      </div>
    </li>
  </ul>
</nav>

<script>
  function toggleNavWpp(event) {
    event.stopPropagation();
    var dropdown = document.getElementById("nav-wpp-dropdown");
    if (dropdown) {
      dropdown.style.display = (dropdown.style.display === "none" || dropdown.style.display === "") ? "flex" : "none";
    }
  }

  document.addEventListener("click", function(event) {
    var dropdown = document.getElementById("nav-wpp-dropdown");
    var btn = document.querySelector(".nav-whatsapp-btn");
    if (dropdown && event.target !== btn && !btn.contains(event.target)) {
      dropdown.style.display = "none";
    }
  });
</script>

<style>
@media (max-width: 768px) {
  /* 1. Definimos un margen izquierdo uniforme para todo el sitio */
  .page-shell, .morandi-nav, .main-container {
    padding-left: 20px !important;
    padding-right: 20px !important;
  }

  /* 2. Alineamos el logo y el menú al mismo margen izquierdo que definimos arriba */
  .morandi-nav {
    align-items: flex-start !important; 
    justify-content: flex-start !important;
  }

  .brand {
    margin-left: 0 !important;
    padding-left: 0 !important;
  }

  /* 3. Limpiamos la cabecera de sección para que no tenga márgenes negativos */
  .section-heading {
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    justify-content: flex-start !important;
    margin-left: 0 !important; 
    padding-left: 0 !important; 
    gap: 10px !important;
  }
  /* 4. Aseguramos que el H2 no tenga margen extra */
  h2, .section-title {
    margin: 0 !important;
    padding: 0 !important;
  }
}
</style>
