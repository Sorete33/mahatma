  </div>

  <div class="whatsapp-menu">
    <button class="whatsapp-float" onclick="toggleMenu()" aria-label="Contacto por WhatsApp">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
    </button>
    <div id="wpp-options" class="wpp-options" style="display:none;">
      <a href="https://wa.me/542346331020?text=Hola!%20Quiero%20hacer%20una%20consulta%" target="_blank" rel="noopener">Mahatma 1</a>
      <a href="https://wa.me/542346688161?text=Hola!%20Quiero%20hacer%20una%20consulta%" target="_blank" rel="noopener">Mahatma 2</a>
      <a href="https://wa.me/542346503834?text=Hola!%20Quiero%20hacer%20una%20consulta%" target="_blank" rel="noopener">Mahatma 3</a>
    </div>
  </div>

  <style>
    .whatsapp-menu { 
      position: fixed; 
      bottom: 30px; 
      right: 30px; 
      z-index: 1000; 
    }
    .whatsapp-float {
      width: 60px;
      height: 60px;
      background-color: #25d366;
      border: none;
      border-radius: 50%;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s ease;
    }
    .whatsapp-float img {
      width: 35px;
      height: 35px;
    }
    .whatsapp-float:hover {
      transform: scale(1.1);
      background-color: #128c7e;
    }
    .wpp-options { 
      position: absolute; 
      bottom: 75px; 
      right: 0; 
      background: white; 
      padding: 12px; 
      border-radius: 10px; 
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      display: flex; 
      flex-direction: column; 
      gap: 10px;
      min-width: 120px;
    }
    .wpp-options a { 
      text-decoration: none; 
      color: #333; 
      font-weight: bold; 
      font-family: sans-serif;
      font-size: 14px;
      padding: 5px 10px;
      border-radius: 5px;
      transition: background 0.2s;
    }
    .wpp-options a:hover {
      background-color: #f0f0f0;
      color: #128c7e;
    }
  </style>

  <script>
    function toggleMenu() {
      var x = document.getElementById("wpp-options");
      if (x.style.display === "none" || x.style.display === "") {
        x.style.display = "flex";
      } else {
        x.style.display = "none";
      }
    }
  </script>
</footer>
