name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main  # O "master", cambialo si tu rama principal se llama distinto

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true  # Por si tenés submódulos de Git para el tema
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.0' # Seteamos tu versión exacta de Hugo
          extended: true

      - name: Build Hugo Site
        run: hugo --gc --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
